<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голубиная почта</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #app { width: 90%; max-width: 1200px; background: #1e2430; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
        #auth-screen { padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .form-group { width: 100%; max-width: 400px; margin-bottom: 1rem; }
        input, button { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-size: 1rem; }
        input { background: #2c3340; color: #fff; border: 1px solid #3a4355; }
        button { background: #5E9BFF; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #4a7fd1; }
        #main-screen { display: flex; height: 100%; display: none; }
        .sidebar { width: 30%; background: #171d27; border-right: 1px solid #2c3340; display: flex; flex-direction: column; }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid #2c3340; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 0.75rem 1rem; border-bottom: 1px solid #2c3340; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .user-item:hover, .user-item.selected { background: #2c3340; }
        .remove-contact { color: #ff5e5e; margin-left: 8px; cursor: pointer; font-weight: bold; }
        .add-contact-btn { background: #3a4355; margin: 0.5rem; padding: 0.5rem; text-align: center; border-radius: 8px; cursor: pointer; }
        .add-contact-btn:hover { background: #4e5a70; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #1e2430; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px; }
        .modal-content input { margin-bottom: 1rem; }
        .modal-buttons { display: flex; gap: 0.5rem; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 1rem; border-bottom: 1px solid #2c3340; font-weight: bold; background: #1e2430; }
        .messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; }
        .message { max-width: 70%; margin-bottom: 0.75rem; padding: 0.5rem 1rem; border-radius: 18px; word-wrap: break-word; }
        .message.sent { align-self: flex-end; background: #5E9BFF; color: #fff; }
        .message.received { align-self: flex-start; background: #2c3340; color: #fff; }
        .message small { display: block; font-size: 0.7rem; opacity: 0.7; margin-top: 0.2rem; }
        .message-image { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 4px; cursor: pointer; }
        .message-file { display: flex; align-items: center; background: #3a4355; padding: 8px; border-radius: 8px; margin-top: 4px; text-decoration: none; color: #fff; }
        .message-file:hover { background: #4e5a70; }
        .file-icon { margin-right: 8px; font-size: 1.2rem; }
        .message-input { display: flex; padding: 1rem; border-top: 1px solid #2c3340; gap: 0.5rem; }
        .message-input input[type="text"] { flex: 1; }
        .message-input input[type="file"] { display: none; }
        .attach-btn { background: #3a4355; padding: 0.75rem; border-radius: 8px; cursor: pointer; }
        .attach-btn:hover { background: #4e5a70; }
        .file-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .file-preview-item { background: #2c3340; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        #logout { background: none; border: 1px solid #5E9BFF; color: #5E9BFF; padding: 0.3rem 0.8rem; width: auto; cursor: pointer; border-radius: 5px; }
        .online-indicator { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Экран авторизации -->
        <div id="auth-screen">
            <h2 style="margin-bottom: 2rem;">🐦 Голубиная почта</h2>
            <div class="form-group">
                <input type="text" id="phone" placeholder="Номер телефона" value="+79001234567">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Пароль" value="123456">
            </div>
            <div class="form-group">
                <input type="text" id="first_name" placeholder="Имя (опционально, только при регистрации)">
            </div>
            <div class="form-group">
                <button onclick="register()">Зарегистрироваться</button>
            </div>
            <div class="form-group">
                <button onclick="login()">Войти</button>
            </div>
        </div>

        <!-- Основной экран чата -->
        <div id="main-screen">
            <div class="sidebar">
                <div class="sidebar-header">
                    <span>Контакты</span>
                    <button id="logout" onclick="logout()">Выйти</button>
                </div>
                <div class="add-contact-btn" onclick="showAddContactModal()">➕ Добавить контакт</div>
                <div class="user-list" id="user-list"></div>
            </div>
            <div class="chat-area">
                <div class="chat-header" id="chat-header">Выберите собеседника</div>
                <div class="messages" id="messages"></div>
                <div class="message-input" id="message-input-container" style="display: none;">
                    <input type="file" id="file-input" multiple onchange="handleFileSelect(event)">
                    <span class="attach-btn" onclick="document.getElementById('file-input').click()">📎</span>
                    <input type="text" id="message-text" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">➤</button>
                </div>
                <div id="file-preview" class="file-preview"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления контакта -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <h3>Добавить контакт</h3>
            <input type="text" id="contactPhone" placeholder="Номер телефона" value="">
            <div class="modal-buttons">
                <button onclick="addContact()">Добавить</button>
                <button onclick="hideAddContactModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // Состояние приложения
        let currentUser = null;
        let token = localStorage.getItem('token');
        let ws = null;
        let selectedUserId = null;
        let users = [];
        let messages = {};
        let pendingFiles = []; // файлы, выбранные для отправки

        const authScreen = document.getElementById('auth-screen');
        const mainScreen = document.getElementById('main-screen');
        const userListDiv = document.getElementById('user-list');
        const messagesDiv = document.getElementById('messages');
        const chatHeader = document.getElementById('chat-header');
        const messageInputContainer = document.getElementById('message-input-container');
        const filePreview = document.getElementById('file-preview');
        const phoneInput = document.getElementById('phone');
        const passwordInput = document.getElementById('password');
        const firstNameInput = document.getElementById('first_name');
        const contactModal = document.getElementById('contactModal');
        const contactPhoneInput = document.getElementById('contactPhone');

        function showAddContactModal() { contactPhoneInput.value = ''; contactModal.style.display = 'flex'; }
        function hideAddContactModal() { contactModal.style.display = 'none'; }

        // Обработка выбора файлов
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                pendingFiles.push(file);
                const previewItem = document.createElement('div');
                previewItem.className = 'file-preview-item';
                previewItem.textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                previewItem.dataset.filename = file.name;
                filePreview.appendChild(previewItem);
            });
            event.target.value = ''; // очищаем input, чтобы можно было выбрать тот же файл снова
        }

        // Загрузка файла на сервер
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            const res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            
            if (res.ok) {
                return await res.json();
            } else {
                throw new Error('Upload failed');
            }
        }

        window.onload = async () => {
            if (token) {
                try {
                    const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
                    if (res.ok) {
                        currentUser = await res.json();
                        await loadContacts();
                        connectWebSocket();
                        authScreen.style.display = 'none';
                        mainScreen.style.display = 'flex';
                    } else {
                        localStorage.removeItem('token'); localStorage.removeItem('user'); token = null;
                    }
                } catch (e) { console.error('Ошибка восстановления сессии', e); }
            }
        };

        async function register() {
            const phone = phoneInput.value, password = passwordInput.value, firstName = firstNameInput.value;
            const res = await fetch('/api/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password, first_name: firstName, last_name: '' })
            });
            res.ok ? alert('Регистрация успешна! Теперь войдите.') : alert('Ошибка: ' + await res.text());
        }

        async function login() {
            const phone = phoneInput.value, password = passwordInput.value;
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            });
            if (res.ok) {
                const data = await res.json();
                token = data.access_token;
                currentUser = { id: data.user_id, phone };
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(currentUser));
                await loadContacts();
                connectWebSocket();
                authScreen.style.display = 'none';
                mainScreen.style.display = 'flex';
            } else alert('Ошибка входа');
        }

        async function loadContacts() {
            const res = await fetch('/api/contacts', { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) { users = await res.json(); renderUserList(); }
            else console.error('Не удалось загрузить контакты');
        }

        function renderUserList() {
            userListDiv.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = `user-item ${selectedUserId === u.id ? 'selected' : ''}`;
                div.innerHTML = `<span>${u.first_name || u.phone} ${u.last_name || ''}</span><span class="remove-contact" onclick="removeContact('${u.phone}', event)">✖</span>`;
                div.onclick = (e) => { if (!e.target.classList.contains('remove-contact')) selectUser(u.id); };
                userListDiv.appendChild(div);
            });
        }

        async function addContact() {
            const phone = contactPhoneInput.value.trim();
            if (!phone) return;
            const res = await fetch('/api/contacts/add', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ phone })
            });
            if (res.ok) { hideAddContactModal(); await loadContacts(); }
            else alert('Ошибка добавления: ' + await res.text());
        }

        async function removeContact(phone, event) {
            event.stopPropagation();
            if (!confirm(`Удалить контакт ${phone}?`)) return;
            const res = await fetch('/api/contacts/remove', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ phone })
            });
            if (res.ok) {
                const removedUser = users.find(u => u.phone === phone);
                if (removedUser && removedUser.id === selectedUserId) {
                    selectedUserId = null;
                    chatHeader.textContent = 'Выберите собеседника';
                    messageInputContainer.style.display = 'none';
                    messagesDiv.innerHTML = '';
                }
                await loadContacts();
            } else alert('Ошибка удаления');
        }

        async function selectUser(userId) {
            selectedUserId = userId;
            renderUserList();
            const user = users.find(u => u.id === userId);
            chatHeader.textContent = `Чат с ${user ? (user.first_name || user.phone) : '...'}`;
            messageInputContainer.style.display = 'flex';
            await loadMessages(userId);
        }

        async function loadMessages(otherUserId) {
            const res = await fetch(`/api/messages/${otherUserId}`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) { 
                messages[otherUserId] = await res.json(); 
                renderMessages(otherUserId); 
            }
        }

        function renderMessages(otherUserId) {
            const msgs = messages[otherUserId] || [];
            messagesDiv.innerHTML = '';
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.sender_id === currentUser.id ? 'sent' : 'received'}`;
                
                let contentHtml = '';
                if (m.content) {
                    contentHtml += `<div>${m.content}</div>`;
                }
                
                if (m.attachment) {
                    const att = m.attachment;
                    if (att.mime_type.startsWith('image/')) {
                        contentHtml += `<img src="${att.file_url}" class="message-image" onclick="window.open('${att.file_url}')" title="${att.file_name}">`;
                    } else {
                        contentHtml += `
                            <a href="${att.file_url}" target="_blank" class="message-file">
                                <span class="file-icon">📎</span>
                                <span>${att.file_name} (${(att.file_size / 1024).toFixed(1)} KB)</span>
                            </a>
                        `;
                    }
                }
                
                div.innerHTML = `${contentHtml} <small>${new Date(m.created_at).toLocaleTimeString()}</small>`;
                messagesDiv.appendChild(div);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Отправка сообщения с файлами
        async function sendMessage() {
            const input = document.getElementById('message-text');
            const content = input.value.trim();
            
            if (!selectedUserId) return;
            if (!content && pendingFiles.length === 0) return;
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Соединение потеряно, переподключаемся...');
                connectWebSocket();
                return;
            }
            
            // Если есть файлы, сначала загружаем их
            if (pendingFiles.length > 0) {
                for (const file of pendingFiles) {
                    try {
                        const uploadResult = await uploadFile(file);
                        // Отправляем сообщение с attachment_id
                        ws.send(JSON.stringify({
                            recipient_id: selectedUserId,
                            content: content || null,
                            attachment_id: uploadResult.attachment_id
                        }));
                    } catch (error) {
                        console.error('File upload failed:', error);
                        alert(`Ошибка загрузки файла ${file.name}`);
                    }
                }
                // Очищаем очередь файлов и превью
                pendingFiles = [];
                filePreview.innerHTML = '';
                input.value = '';
            } else {
                // Просто текстовое сообщение
                ws.send(JSON.stringify({
                    recipient_id: selectedUserId,
                    content: content
                }));
                input.value = '';
            }
        }

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => { ws.send(JSON.stringify({ token })); };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const otherId = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
                if (!messages[otherId]) messages[otherId] = [];
                messages[otherId].push(msg);
                if (otherId === selectedUserId) renderMessages(selectedUserId);
            };
            ws.onclose = () => setTimeout(connectWebSocket, 2000);
            ws.onerror = (err) => console.error('WebSocket error', err);
        }

        function logout() {
            if (ws) ws.close();
            localStorage.removeItem('token'); localStorage.removeItem('user');
            token = null; currentUser = null; selectedUserId = null;
            authScreen.style.display = 'flex'; mainScreen.style.display = 'none';
        }
    </script>
</body>
</html>
